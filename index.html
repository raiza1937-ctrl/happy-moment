<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мʼякі іграшки</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            color: #333;
        }

        header {
            background: #1e1e1e;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header img {
            max-width: 140px;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
        }

        h1, h2 {
            text-align: center;
        }

        /* Фото автомата */
        .machine-image {
            width: 100%;
            max-width: 420px;
            display: block;
            margin: 20px auto 40px;
        }

        /* Іграшки */
        .toys {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .toy {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
        }

        .toy img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
        }

        .buy-wrapper {
            text-align: center;
            margin: 40px 0 10px;
        }

        .buy-button {
            padding: 16px 36px;
            background: #ff9800;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin: 30px 0 10px;
        }

        footer a {
            color: #777;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png" alt="Логотип">
    <h1>Мʼякі іграшки</h1>
</header>

<div class="container">

    <!-- ТІЛЬКИ ФОТО АВТОМАТА -->
    <img src="machine.jpg" alt="Автомат" class="machine-image">

    <h2>🎁 Іграшки</h2>

    <div class="toys">
        <div class="toy">
            <img src="myaka-igrashka-kotyk.jpg" alt="Котик">
            <p>Мʼяка іграшка «Котик»</p>
        </div>

        <div class="toy">
            <img src="myaka-igrashka-vedmedyk.jpg" alt="Ведмедик">
            <p>Мʼяка іграшка «Ведмедик»</p>
        </div>

        <div class="toy">
            <img src="myaka-igrashka-zaychyk.jpg" alt="Зайчик">
            <p>Мʼяка іграшка «Зайчик»</p>
        </div>
    </div>

    <!-- КНОПКА КУПИТИ -->
    <div class="buy-wrapper">
        <!-- ВСТАВИ СВОЮ РЕАЛЬНУ ССИЛКУ НА ОПЛАТУ -->
        <a href="https://pay.example.com" class="buy-button" target="_blank">
            Купити
        </a>
    </div>

</div>

<footer>
    <a href="contacts.html">Контакти</a> |
    <a href="offer.html">Оферта</a> |
    <a href="terms.html">Умови</a> |
    <a href="privacy.html">Конфіденційність</a> |
    <a href="refund.html">Повернення</a>
</footer>

</body>
</html>
