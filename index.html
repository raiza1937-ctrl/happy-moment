<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Развлекательный призовой автомат</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Описание для эквайринга -->
    <meta name="description" content="Развлекательный сервис с призовыми автоматами. Оплата услуги участия в развлекательной активности.">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .machine-image {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 20px auto;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
        }

        .buy-wrapper {
            text-align: center;
            margin-top: 30px;
        }

        .buy-button {
            display: inline-block;
            padding: 16px 32px;
            background-color: #ff9800;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.3s;
        }

        .buy-button:hover {
            background-color: #e68900;
        }

        footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin: 30px 0 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Развлекательный призовой автомат</h1>
</header>

<div class="container">

    <!-- Фото автомата -->
    <img src="machine.jpg" alt="Призовой автомат" class="machine-image">

    <p class="description">
        Мы предоставляем услуги в сфере развлечений через призовые автоматы.
        Пользователь оплачивает участие в развлекательной активности.
        Сервис не является азартной игрой и не содержит элементов казино.
    </p>

    <div class="buy-wrapper">
        <!-- ССЫЛКУ ЗАМЕНИ НА СВОЮ -->
        <a href="https://pay.example.com" class="buy-button" target="_blank">
            Оплатить услугу
        </a>
    </div>

</div>

<footer>
    © 2026 Развлекательный сервис. Все права защищены.
</footer>

</body>
</html>
